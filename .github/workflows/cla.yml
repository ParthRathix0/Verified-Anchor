name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        # The CLA exists to cover contributions from OUTSIDE the project. A pull request whose
        # head branch lives in this repository can only have been pushed by someone with write
        # access — currently the sole maintainer — so there is no inbound contribution to
        # license and the check is skipped. Fork pull requests, which is every outside
        # contribution, stay fully gated.
        #
        # The STEP is skipped rather than the job, deliberately. `cla` is a required status
        # check on master, and a job that never runs never reports a status, which would leave
        # every maintainer pull request permanently unmergeable. A job whose only step is
        # skipped still completes successfully and reports.
        #
        # The comment-driven routes (signing, and `recheck`) are kept unconditional so a
        # contributor can always sign or re-trigger on their own pull request.
        if: >-
          (github.event_name == 'pull_request_target'
            && github.event.pull_request.head.repo.full_name != github.repository)
          || github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only because the signature store lives in a separate PRIVATE repository.
          # Needs a token with write access to ParthRathix0/Verified-Anchor-Private; the default
          # GITHUB_TOKEN is scoped to this repository and cannot reach it.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_STORE_TOKEN }}
        with:
          # Signatures are kept OUT of the public repository. The record is only a GitHub
          # username, user id, timestamp and pull request number, but there is no reason to
          # publish it when the action supports private storage.
          remote-organization-name: ParthRathix0
          remote-repository-name: Verified-Anchor-Private
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/ParthRathix0/Verified-Anchor/blob/master/CLA.md'
          # A branch that EXISTS in the remote store repository. The action hard-errors with
          # "Branch <name> not found" and then misreports it as an unsigned CLA, so this must
          # track the private repository's default branch, not the old in-repo branch name.
          branch: 'master'
          allowlist: ParthRathix0,dependabot[bot]
          custom-notsigned-prcomment: |
            Thanks for the pull request. Before it can be merged, please sign the
            [Contributor License Agreement](https://github.com/ParthRathix0/Verified-Anchor/blob/master/CLA.md)
            by posting a comment on this pull request containing exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you.'
