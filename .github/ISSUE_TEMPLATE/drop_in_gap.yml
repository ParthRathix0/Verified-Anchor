name: Drop-in gap
description: Real Anchor code that will not compile under #[derive(VerifiedAccounts)]
labels: [drop-in]
body:
  - type: markdown
    attributes:
      value: |
        Verified Anchor's first directive is **drop-in**: real, existing Anchor source should
        compile and run unedited after swapping `#[derive(Accounts)]` for
        `#[derive(VerifiedAccounts)]`. Code that forces you to rewrite your program is a defect,
        not a documented limitation. These reports are valuable — thank you.
  - type: textarea
    id: anchor_struct
    attributes:
      label: The Anchor struct, as it exists in your program today
      description: Unmodified, exactly as it compiles under stock anchor-lang.
      render: rust
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: The exact compiler error
      render: shell
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Link to the real program this came from, if public
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This struct compiles under stock `anchor-lang`.
          required: true
